<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid mx-5 py-1">
            <img src="assets/images/logo laptop.jpg" alt="Logo" width="40" class="d-inline-block align-text-top">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav gap-4 ms-4">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold active" href="#">My Laptop</a>
                    </li>
                </ul>
            </div>
            <button type="button" class="btn btn-dark fw-semibold px-3">Contact Us</button>
        </div>
    </nav>
    <div class="container-fluid bg-light pb-5">
        <!-- Formulir Add Laptop -->
        <div class="row align-items-start justify-content-center">
            <div class="col-4">
                <h1 class="text-center p-5 fw-bold">ADD MY LAPTOP</h1>
                <form id="myLaptop">
                    <div class="mb-4">
                        <label for="namaLaptop" class="form-label fw-semibold">Nama Laptop</label>
                        <input type="text" class="form-control shadow-sm" id="namaLaptop" placeholder="Masukkan Nama Laptop" autocomplete="off" required>
                    </div>
                    <div class="row mb-4">
                        <div class="col">
                            <label for="tanggalBeli" class="form-label fw-semibold">Tanggal Beli</label>
                            <input type="date" class="form-control shadow-sm" id="tanggalBeli" autocomplete="off" required>
                        </div>
                        <div class="col">
                            <label for="tanggalJual" class="form-label fw-semibold">Tanggal Dijual</label>
                            <input type="date" class="form-control shadow-sm" id="tanggalJual" autocomplete="off" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="deskripsi" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control shadow-sm" id="deskripsi" style="height: 200px" rows="3" required></textarea>
                    </div>
                    <div class="mb-4">
                        <label for="Tersedia" class="form-label fw-semibold">Kondisi</label>
                        <br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="monitorBagus" value="option1">
                            <label class="form-check-label" for="monitorBagus">Monitor Bagus</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="keyboardBagus" value="option2">
                            <label class="form-check-label" for="keyboardBagus">Keyboard Bagus</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="casingBagus" value="option3">
                            <label class="form-check-label" for="casingBagus">Casing Bagus</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="formFile" class="form-label fw-semibold">Gambar Laptop</label>
                        <input class="form-control" type="file" id="formFile">
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-dark px-4 rounded rounded-pill">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Hasil Form -->
    <div id="hasil"></div>

    <script src="assets/scripts/addLaptop.js"></script>
</body>
</html>
